# 매주 토요일 오전 9시(한국 시간)에 Supabase에 접속해서 무료 프로젝트가 일시 정지되지 않게 합니다.
name: Supabase 주간 접속

on:
  schedule:
    - cron: "0 0 * * 6"   # UTC 토요일 00:00 = 한국 토요일 09:00
  workflow_dispatch: {}    # Actions 화면에서 직접 실행도 가능

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase에 접속 (게시글 1건 읽기)
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js | head -1)
          curl -fsS "$URL/rest/v1/posts?select=id&limit=1" -H "apikey: $KEY" -o /dev/null -w "HTTP %{http_code}\n"
          curl -fsS "$URL/auth/v1/health" -H "apikey: $KEY" -o /dev/null -w "Auth HTTP %{http_code}\n"

      # GitHub는 60일 동안 변화가 없는 저장소의 예약 실행을 멈추므로, 접속 기록을 남겨 둡니다.
      # [skip netlify] 표시로 홈페이지 재배포는 하지 않습니다.
      - name: 접속 기록 남기기
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-ping.txt
          git config user.name "raiblab-bot"
          git config user.email "raiblab-bot@users.noreply.github.com"
          git add .github/last-ping.txt
          git commit -m "주간 접속 기록 [skip netlify]" || exit 0
          git push
